</text><text class="terminal-2831852474-r1" x="0" y="44.4" textLength="488" clip-path="url(#terminal-2831852474-line-1)">&#160;&#160;GPU:&#160;NVIDIA&#160;GeForce&#160;RTX&#160;4060,&#160;8188&#160;MiB</text><text class="terminal-2831852474-r1" x="1439.6" y="44.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-1)">
</text><text class="terminal-2831852474-r1" x="0" y="68.8" textLength="219.6" clip-path="url(#terminal-2831852474-line-2)">&#160;&#160;CPU:&#160;x86_64&#160;AVX2</text><text class="terminal-2831852474-r1" x="1439.6" y="68.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-2)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="93.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-3)">
</text><text class="terminal-2831852474-r1" x="0" y="117.6" textLength="366" clip-path="url(#terminal-2831852474-line-4)">How&#160;should&#160;ButterBot&#160;hear&#160;you?</text><text class="terminal-2831852474-r1" x="1439.6" y="117.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-4)">
</text><text class="terminal-2831852474-r1" x="0" y="142" textLength="1049.2" clip-path="url(#terminal-2831852474-line-5)">&#160;&#160;1)&#160;Local&#160;Whisper&#160;on&#160;this&#160;machine&#160;(private,&#160;free;&#160;uses&#160;an&#160;NVIDIA&#160;GPU&#160;if&#160;there&#160;is&#160;one)</text><text class="terminal-2831852474-r1" x="1439.6" y="142" textLength="12.2" clip-path="url(#terminal-2831852474-line-5)">
</text><text class="terminal-2831852474-r1" x="0" y="166.4" textLength="732" clip-path="url(#terminal-2831852474-line-6)">&#160;&#160;2)&#160;Groq&#160;hosted&#160;Whisper&#160;(very&#160;fast,&#160;free&#160;tier,&#160;needs&#160;a&#160;key)</text><text class="terminal-2831852474-r1" x="1439.6" y="166.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-6)">
</text><text class="terminal-2831852474-r1" x="0" y="190.8" textLength="341.6" clip-path="url(#terminal-2831852474-line-7)">&#160;&#160;3)&#160;OpenAI&#160;transcription&#160;AP</text><text class="terminal-2831852474-r2" x="341.6" y="190.8" textLength="36.6" clip-path="url(#terminal-2831852474-line-7)">I&#160;(</text><text class="terminal-2831852474-r1" x="378.2" y="190.8" textLength="146.4" clip-path="url(#terminal-2831852474-line-7)">needs&#160;a&#160;key)</text><text class="terminal-2831852474-r1" x="1439.6" y="190.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-7)">
</text><text class="terminal-2831852474-r1" x="0" y="215.2" textLength="329.4" clip-path="url(#terminal-2831852474-line-8)">&#160;&#160;4)&#160;Deepgram&#160;(needs&#160;a&#160;key)</text><text class="terminal-2831852474-r1" x="1439.6" y="215.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-8)">
</text><text class="terminal-2831852474-r1" x="0" y="239.6" textLength="976" clip-path="url(#terminal-2831852474-line-9)">&#160;&#160;5)&#160;A&#160;transcription&#160;server&#160;I&#160;already&#160;run&#160;(whisper.cpp,&#160;Speaches,&#160;LocalAI,&#160;vLLM)</text><text class="terminal-2831852474-r1" x="1439.6" y="239.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-9)">
</text><text class="terminal-2831852474-r3" x="0" y="264" textLength="97.6" clip-path="url(#terminal-2831852474-line-10)">Choose&#160;[</text><text class="terminal-2831852474-r1" x="97.6" y="264" textLength="61" clip-path="url(#terminal-2831852474-line-10)">1]:&#160;1</text><text class="terminal-2831852474-r1" x="1439.6" y="264" textLength="12.2" clip-path="url(#terminal-2831852474-line-10)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="288.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-11)">
</text><text class="terminal-2831852474-r1" x="0" y="312.8" textLength="719.8" clip-path="url(#terminal-2831852474-line-12)">What&#160;should&#160;answer&#160;questions&#160;that&#160;aren&#x27;t&#160;built-in&#160;commands?</text><text class="terminal-2831852474-r1" x="1439.6" y="312.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-12)">
</text><text class="terminal-2831852474-r1" x="0" y="337.2" textLength="549" clip-path="url(#terminal-2831852474-line-13)">&#160;&#160;1)&#160;Google&#160;Gemini&#160;(fast,&#160;generous&#160;free&#160;tier)</text><text class="terminal-2831852474-r1" x="1439.6" y="337.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-13)">
</text><text class="terminal-2831852474-r1" x="0" y="361.6" textLength="256.2" clip-path="url(#terminal-2831852474-line-14)">&#160;&#160;2)&#160;Anthropic&#160;Claude</text><text class="terminal-2831852474-r1" x="1439.6" y="361.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-14)">
</text><text class="terminal-2831852474-r1" x="0" y="386" textLength="524.6" clip-path="url(#terminal-2831852474-line-15)">&#160;&#160;3)&#160;OpenRouter&#160;(hundreds&#160;of&#160;hosted&#160;models)</text><text class="terminal-2831852474-r1" x="1439.6" y="386" textLength="12.2" clip-path="url(#terminal-2831852474-line-15)">
</text><text class="terminal-2831852474-r1" x="0" y="410.4" textLength="134.2" clip-path="url(#terminal-2831852474-line-16)">&#160;&#160;4)&#160;OpenAI</text><text class="terminal-2831852474-r1" x="1439.6" y="410.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-16)">
</text><text class="terminal-2831852474-r1" x="0" y="434.8" textLength="475.8" clip-path="url(#terminal-2831852474-line-17)">&#160;&#160;5)&#160;Ollama&#160;on&#160;my&#160;network&#160;(local,&#160;free)</text><text class="terminal-2831852474-r1" x="1439.6" y="434.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-17)">
</text><text class="terminal-2831852474-r1" x="0" y="459.2" textLength="512.4" clip-path="url(#terminal-2831852474-line-18)">&#160;&#160;6)&#160;LM&#160;Studio&#160;on&#160;my&#160;network&#160;(local,&#160;free)</text><text class="terminal-2831852474-r1" x="1439.6" y="459.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-18)">
</text><text class="terminal-2831852474-r1" x="0" y="483.6" textLength="195.2" clip-path="url(#terminal-2831852474-line-19)">&#160;&#160;7)&#160;vLLM&#160;server</text><text class="terminal-2831852474-r1" x="1439.6" y="483.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-19)">
</text><text class="terminal-2831852474-r1" x="0" y="508" textLength="439.2" clip-path="url(#terminal-2831852474-line-20)">&#160;&#160;8)&#160;No&#160;LLM&#160;-&#160;built-in&#160;commands&#160;only</text><text class="terminal-2831852474-r1" x="1439.6" y="508" textLength="12.2" clip-path="url(#terminal-2831852474-line-20)">
</text><text class="terminal-2831852474-r3" x="0" y="532.4" textLength="97.6" clip-path="url(#terminal-2831852474-line-21)">Choose&#160;[</text><text class="terminal-2831852474-r1" x="97.6" y="532.4" textLength="61" clip-path="url(#terminal-2831852474-line-21)">1]:&#160;1</text><text class="terminal-2831852474-r1" x="1439.6" y="532.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-21)">
</text><text class="terminal-2831852474-r1" x="0" y="556.8" textLength="414.8" clip-path="url(#terminal-2831852474-line-22)">Model&#160;[gemini-flash-lite-latest]:&#160;</text><text class="terminal-2831852474-r1" x="1439.6" y="556.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-22)">
</text><text class="terminal-2831852474-r1" x="0" y="581.2" textLength="622.2" clip-path="url(#terminal-2831852474-line-23)">GEMINI_API_KEY&#160;(input&#160;hidden,&#160;Enter&#160;to&#160;set&#160;later):&#160;</text><text class="terminal-2831852474-r1" x="1439.6" y="581.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-23)">
</text><text class="terminal-2831852474-r1" x="0" y="605.6" textLength="1183.4" clip-path="url(#terminal-2831852474-line-24)">Timezone&#160;(IANA&#160;name,&#160;for&#160;alarms,&#160;reminders&#160;and&#160;the&#160;calendar)&#160;[Europe/Amsterdam]:&#160;Europe/Amsterdam</text><text class="terminal-2831852474-r1" x="1439.6" y="605.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-24)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="630" textLength="12.2" clip-path="url(#terminal-2831852474-line-25)">
</text><text class="terminal-2831852474-r1" x="0" y="654.4" textLength="878.4" clip-path="url(#terminal-2831852474-line-26)">Calendar&#160;(optional):&#160;ButterBot&#160;can&#160;summarise&#160;your&#160;day&#160;from&#160;an&#160;iCal&#160;link.</text><text class="terminal-2831852474-r1" x="1439.6" y="654.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-26)">
</text><text class="terminal-2831852474-r1" x="0" y="678.8" textLength="341.6" clip-path="url(#terminal-2831852474-line-27)">&#160;&#160;Google&#160;Calendar:&#160;Settings&#160;</text><text class="terminal-2831852474-r4" x="341.6" y="678.8" textLength="463.6" clip-path="url(#terminal-2831852474-line-27)">&gt;&#160;your&#160;calendar&#160;&gt;&#160;Integrate&#160;calendar&#160;&gt;</text><text class="terminal-2831852474-r1" x="1439.6" y="678.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-27)">
</text><text class="terminal-2831852474-r1" x="0" y="703.2" textLength="988.2" clip-path="url(#terminal-2831852474-line-28)">&#160;&#160;&#x27;Secret&#160;address&#160;in&#160;iCal&#160;format&#x27;.&#160;Several&#160;calendars:&#160;separate&#160;links&#160;with&#160;spaces.</text><text class="terminal-2831852474-r1" x="1439.6" y="703.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-28)">
</text><text class="terminal-2831852474-r1" x="0" y="727.6" textLength="585.6" clip-path="url(#terminal-2831852474-line-29)">Calendar&#160;link(s)&#160;(input&#160;hidden,&#160;Enter&#160;to&#160;skip):&#160;</text><text class="terminal-2831852474-r1" x="1439.6" y="727.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-29)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="752" textLength="12.2" clip-path="url(#terminal-2831852474-line-30)">
</text><text class="terminal-2831852474-r4" x="0" y="776.4" textLength="61" clip-path="url(#terminal-2831852474-line-31)">Wrote</text><text class="terminal-2831852474-r1" x="61" y="776.4" textLength="1000.4" clip-path="url(#terminal-2831852474-line-31)">&#160;/home/you/bb-voice-gateway/config.yaml&#160;and&#160;/home/you/bb-voice-gateway/secret.env.</text><text class="terminal-2831852474-r1" x="1439.6" y="776.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-31)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="800.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-32)">
</text><text class="terminal-2831852474-r1" x="0" y="825.2" textLength="366" clip-path="url(#terminal-2831852474-line-33)">Start&#160;the&#160;gateway&#160;with&#160;ONE&#160;of:</text><text class="terminal-2831852474-r1" x="1439.6" y="825.2" textLength="12.2" clip-path="url(#terminal-2831852474-line-33)">
</text><text class="terminal-2831852474-r1" x="0" y="849.6" textLength="1000.4" clip-path="url(#terminal-2831852474-line-34)">&#160;&#160;docker&#160;compose&#160;--profile&#160;gpu&#160;up&#160;-d&#160;--build&#160;&#160;&#160;&#160;&#160;&#160;#&#160;Docker&#160;(Windows,&#160;Linux,&#160;macOS)</text><text class="terminal-2831852474-r1" x="1439.6" y="849.6" textLength="12.2" clip-path="url(#terminal-2831852474-line-34)">
</text><text class="terminal-2831852474-r1" x="0" y="874" textLength="963.8" clip-path="url(#terminal-2831852474-line-35)">&#160;&#160;sudo&#160;./install.sh&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;#&#160;Linux&#160;native&#160;(systemd)</text><text class="terminal-2831852474-r1" x="1439.6" y="874" textLength="12.2" clip-path="url(#terminal-2831852474-line-35)">
</text><text class="terminal-2831852474-r1" x="1439.6" y="898.4" textLength="12.2" clip-path="url(#terminal-2831852474-line-36)">
</text><text class="terminal-2831852474-r1" x="0" y="922.8" textLength="1183.4" clip-path="url(#terminal-2831852474-line-37)">Then&#160;point&#160;ButterBot&#160;at&#160;ws://&lt;this&#160;machine&#x27;s&#160;IP&gt;:8765/bb&#160;and&#160;allow&#160;TCP&#160;8765&#160;through&#160;the&#160;firewall.</text><text class="terminal-2831852474-r1" x="1439.6" y="922.8" textLength="12.2" clip-path="url(#terminal-2831852474-line-37)">
